services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: creavent
      POSTGRES_PASSWORD: creavent
      POSTGRES_DB: creavent
    ports:
      # Set POSTGRES_PORT if another Postgres already uses 5432 on this machine.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
